<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --text: #1f2328;
      --muted: #6b7280;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --text: #e6e8eb;
        --muted: #9aa3ad;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      font-size: 1.125rem;
      margin: 0;
    }
    .bar {
      width: 3rem;
      height: 4px;
      background: var(--accent);
      border-radius: 2px;
      margin: 1.5rem auto 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Coming Soon</h1>
    <p>My blog and resume are under construction. Check back soon.</p>
    <div class="bar"></div>
  </main>
</body>
</html>
